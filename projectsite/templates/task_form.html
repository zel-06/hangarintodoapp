{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="btnback">
    {% if from_page == 'home' %}
        <a href="{% url 'home' %}" class="btn">Back</a>
    {% else %}
        <a href="{% url 'task-list' %}" class="btn">Back</a>
    {% endif %}
</div>

<div class="task-container">
    <h2 class="page-title">Add New Task</h2>
    <div class="task-card">
        <form action="" method="post" novalidate>
            {% csrf_token %}
            {% include 'includes/form.html' %}

            <button type="submit" class="btn-submit">Submit</button>
        </form>
    </div>
</div>
{% endblock %}
