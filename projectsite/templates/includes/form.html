{% load widget_tweaks %}

{% for field in form %}
<div class="mb-3">
    <label class="form-label">{{ field.label }}</label>
    {% render_field field class="form-control" %}
    {% if field.errors %}
        <div class="text-danger">
            {% for error in field.errors %}
                <small>{{ error }}</small>
            {% endfor %}
        </div>
    {% endif %}
</div>
{% endfor %}
