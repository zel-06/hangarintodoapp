{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hangarin: Task & To-Do Manager{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}" />
</head>
<body>

    <div class="navbar">
        <h2>Hangarin: Task & To-Do Manager</h2>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'task-list' %}">Dashboard</a>
            {% if request.user.is_authenticated %}
            <div class="dropdown">
            <button class="dropbtn">Settings</button>
            <div class="dropdown-content">
            <span class="nav-user">User: {{ request.user.username }}</span>
            <span class="nav-email">Email: {{ request.user.email }}</span>
            <a href="{% url 'account_logout' %}">Logout</a>
                </div>
            </div>
        {% endif %}
        </div>
    </div>

        <div class="main">
            {% block content %}
            {% endblock %}
        </div>
    </div>

</body>
</html>
